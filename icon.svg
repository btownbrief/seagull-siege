<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c1b5e"/><stop offset=".45" stop-color="#b3456f"/><stop offset=".8" stop-color="#ff9a5c"/><stop offset="1" stop-color="#ffd27e"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#ffb347"/></radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d9cb4"/><stop offset="1" stop-color="#e9eef7"/></linearGradient>
    <linearGradient id="fry" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f5b82e"/></linearGradient>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="352" cy="360" r="120" fill="url(#sun)"/>
    <path d="M0 372 L70 332 120 360 190 318 250 356 330 322 400 358 470 330 512 352 V512 H0Z" fill="#5b2c66" opacity=".85"/>
    <rect y="400" width="512" height="112" fill="#244f3a"/>
    <!-- wings -->
    <g stroke="#2b1442" stroke-width="10" stroke-linejoin="round">
      <path d="M170 238 C110 214 50 170 14 120 C70 118 130 150 196 196Z" fill="url(#wing)"/>
      <path d="M342 238 C402 214 462 170 498 120 C442 118 382 150 316 196Z" fill="url(#wing)" transform="translate(0 0)"/>
      <path d="M14 120 C26 140 38 152 54 164 L40 132Z M498 120 C486 140 474 152 458 164 L472 132Z" fill="#222a3d"/>
    </g>
    <!-- head -->
    <g stroke="#2b1442" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="256" cy="236" rx="118" ry="112" fill="#fff"/>
      <path d="M214 276 L298 276 L256 342Z" fill="#ffb62e"/>
      <!-- fry in the beak -->
      <rect x="266" y="270" width="26" height="92" rx="8" fill="url(#fry)" transform="rotate(-24 279 316)"/>
      <rect x="236" y="276" width="24" height="84" rx="8" fill="url(#fry)" transform="rotate(14 248 318)"/>
    </g>
    <circle cx="226" cy="300" r="7" fill="#e5483f"/>
    <g fill="#ffe14a" stroke="#2b1442" stroke-width="8"><circle cx="208" cy="224" r="26"/><circle cx="304" cy="224" r="26"/></g>
    <g fill="#2b1442"><circle cx="214" cy="230" r="13"/><circle cx="298" cy="230" r="13"/></g>
    <g fill="#fff"><circle cx="209" cy="224" r="4.5"/><circle cx="293" cy="224" r="4.5"/></g>
    <g stroke="#2b1442" stroke-width="14" stroke-linecap="round"><path d="M170 180 L232 206"/><path d="M342 180 L280 206"/></g>
  </g>
</svg>
