<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seagull Siege</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2c1b5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seagull Siege">
<meta name="description" content="Seagull Siege — a formation shooter. Shoo the swooping gulls and guard your fries at a sunset lakeside picnic.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800;900&display=swap">
<style>
  :root { --u: 1px; --cream: #fff4d6; --plum: #2b1442; --sun: #ffb347; --sun2: #ffe08a; --coral: #ff6b5e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c0f3a; overscroll-behavior: none; position: fixed; inset: 0; width: 100%; }
  body { font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--cream);
    background: radial-gradient(120% 90% at 50% 40%, #6a2f7e 0%, #2c1b5e 55%, #140a2a 100%); touch-action: none; }
  #stage { position: absolute; left: 0; top: 0; width: 360px; height: 780px; overflow: hidden; touch-action: none; background: #2c1b5e; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .disp { font-family: 'Bangers', 'Arial Black', Impact, sans-serif; letter-spacing: calc(var(--u) * 1); font-weight: 400; }

  #hudbtns { position: absolute; right: calc(var(--u) * 8); top: calc(var(--u) * 8 + var(--inset-top, 0px)); display: none; gap: calc(var(--u) * 6); z-index: 5; }
  .round { width: max(calc(var(--u) * 38), 36px); height: max(calc(var(--u) * 38), 36px); border-radius: 50%; border: calc(var(--u) * 2) solid rgba(255,244,214,.7);
    background: rgba(43,20,66,.62); color: var(--cream); display: grid; place-items: center; padding: 0; cursor: pointer; touch-action: manipulation; }
  .round:active { transform: scale(.92); background: rgba(120,60,130,.75); }
  .round svg { width: 56%; height: 56%; fill: currentColor; stroke: currentColor; }
  .round.off { opacity: .55; }

  .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10;
    padding: calc(var(--u) * 20 + var(--inset-top, 0px)) calc(var(--u) * 20) calc(var(--u) * 24 + var(--inset-bot, 0px)); }
  .screen.show { display: flex; animation: fadein .28s ease-out both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(calc(var(--u) * 10)); } to { opacity: 1; transform: none; } }
  .shade { background: rgba(28,12,50,.66); backdrop-filter: blur(calc(var(--u) * 3)); -webkit-backdrop-filter: blur(calc(var(--u) * 3)); }
  #title { justify-content: flex-start; padding-top: calc(var(--u) * 70 + var(--inset-top, 0px)); }

  .logo { line-height: .84; margin-bottom: calc(var(--u) * 6); transform: rotate(-3deg); filter: drop-shadow(0 calc(var(--u) * 6) calc(var(--u) * 10) rgba(20,5,40,.7)); }
  .logo .l1 { font-size: calc(var(--u) * 92); display: block; background: linear-gradient(180deg, #ffffff 0%, #ffe9c4 50%, #ffb347 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: calc(var(--u) * 6) #2b1442; paint-order: stroke fill; letter-spacing: calc(var(--u) * 3); }
  .logo .l2 { font-size: calc(var(--u) * 78); display: block; margin-top: calc(var(--u) * -2); background: linear-gradient(180deg, #ffd2c8 0%, #ff6b5e 55%, #c42f55 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: calc(var(--u) * 6) #2b1442; paint-order: stroke fill; letter-spacing: calc(var(--u) * 5); transform: translateX(calc(var(--u) * 14)); }
  .tag { font-weight: 900; font-size: calc(var(--u) * 12.5); color: #ffe6c2; letter-spacing: calc(var(--u) * 0.5); margin-bottom: calc(var(--u) * 22); text-shadow: 0 calc(var(--u) * 1.5) calc(var(--u) * 4) rgba(20,5,40,.9); }

  .btn { font-family: 'Bangers', Impact, sans-serif; font-size: calc(var(--u) * 28); letter-spacing: calc(var(--u) * 1.5); color: #3a1c04; background: linear-gradient(180deg, #fff0a8, #ffb347);
    border: calc(var(--u) * 3) solid #2b1442; border-radius: calc(var(--u) * 16); padding: calc(var(--u) * 9) calc(var(--u) * 26); min-width: calc(var(--u) * 190); cursor: pointer;
    box-shadow: 0 calc(var(--u) * 5) 0 #8d3d12, 0 calc(var(--u) * 10) calc(var(--u) * 14) rgba(15,3,30,.55); transition: transform .08s; position: relative; touch-action: manipulation; }
  .btn:active { transform: translateY(calc(var(--u) * 4)); box-shadow: 0 calc(var(--u) * 1) 0 #8d3d12; }
  .btn.big { font-size: calc(var(--u) * 42); padding: calc(var(--u) * 8) calc(var(--u) * 36); min-width: calc(var(--u) * 240); animation: pulse 1.8s ease-in-out infinite; }
  .btn.alt { color: var(--cream); background: linear-gradient(180deg, #a64fb8, #6a2f8e); border-color: #2b1442; box-shadow: 0 calc(var(--u) * 5) 0 #3a1860, 0 calc(var(--u) * 10) calc(var(--u) * 14) rgba(15,3,30,.55); min-width: 0; font-size: calc(var(--u) * 22); padding: calc(var(--u) * 7) calc(var(--u) * 18); }
  .btn.alt:active { box-shadow: 0 calc(var(--u) * 1) 0 #3a1860; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  .btn.big:active { animation: none; }
  .row { display: flex; gap: calc(var(--u) * 12); justify-content: center; margin-top: calc(var(--u) * 16); flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 14); }

  h2.disp { font-size: calc(var(--u) * 52); margin: 0 0 calc(var(--u) * 6); color: #fff; -webkit-text-stroke: calc(var(--u) * 4) #2b1442; paint-order: stroke fill; text-shadow: 0 calc(var(--u) * 5) calc(var(--u) * 12) rgba(15,3,30,.6); }
  h2.disp.gold { color: var(--sun2); }
  .sub { font-weight: 800; font-size: calc(var(--u) * 15); color: #ffe6c2; margin: 0 0 calc(var(--u) * 12); }
  .stat { font-weight: 900; font-size: calc(var(--u) * 15); color: #ffe6c2; margin: calc(var(--u) * 3) 0; }
  .stat b { color: #fff; font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 1.6em; margin-left: calc(var(--u) * 6); letter-spacing: calc(var(--u) * 1); }
  .badge { display: inline-block; background: linear-gradient(180deg, #fff0a8, #ffb347); color: #5a2a08; font-family: 'Bangers', sans-serif; font-size: calc(var(--u) * 22); padding: calc(var(--u) * 3) calc(var(--u) * 14); border-radius: calc(var(--u) * 20); border: calc(var(--u) * 2) solid #2b1442; margin: calc(var(--u) * 6) 0 calc(var(--u) * 4); animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; transform: rotate(-3deg); letter-spacing: calc(var(--u) * 1); }
  @keyframes pop { from { transform: scale(0) rotate(-12deg); } to { transform: scale(1) rotate(-3deg); } }
  .small { font-size: calc(var(--u) * 12); color: #d9b6d4; margin-top: calc(var(--u) * 10); font-weight: 800; }
  .best { font-weight: 900; font-size: calc(var(--u) * 15); color: #ffe6c2; margin-top: calc(var(--u) * 14); }
  .best b { color: var(--sun2); font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 1.5em; letter-spacing: calc(var(--u) * 1); }
  .sndrow { display: flex; gap: calc(var(--u) * 10); margin-top: calc(var(--u) * 18); }
  #hintrow { margin-top: calc(var(--u) * 20); font-weight: 800; font-size: calc(var(--u) * 13); color: #ffe6c2; line-height: 1.5; text-shadow: 0 calc(var(--u)*1.5) calc(var(--u)*4) rgba(20,5,40,.9); }
  #hintrow b { color: var(--sun2); }
  .goal { margin-top: calc(var(--u) * 14); font-weight: 900; font-size: calc(var(--u) * 14); color: #2b1442; background: rgba(255,240,200,.92); border: calc(var(--u) * 2) solid #2b1442; border-radius: calc(var(--u) * 12); padding: calc(var(--u) * 6) calc(var(--u) * 14); line-height: 1.35; max-width: calc(var(--u) * 300); }
  .goal:empty { display: none; }
  .goal .newp { color: #6a2f8e; font-size: .92em; }
  .btn.daily { display: flex; flex-direction: column; align-items: center; line-height: 1; font-size: calc(var(--u) * 24); padding: calc(var(--u) * 7) calc(var(--u) * 22) calc(var(--u) * 6); min-width: calc(var(--u) * 240);
    color: #10382a; background: linear-gradient(180deg, #d6ffe9, #6fe0a8); box-shadow: 0 calc(var(--u) * 5) 0 #1f7a55, 0 calc(var(--u) * 10) calc(var(--u) * 14) rgba(15,3,30,.55); }
  .btn.daily:active { box-shadow: 0 calc(var(--u) * 1) 0 #1f7a55; }
  .btn.daily .d2 { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: calc(var(--u) * 11.5); letter-spacing: 0; margin-top: calc(var(--u) * 3); color: #1f5c43; display: flex; gap: calc(var(--u) * 8); }
  #dailyStreak:not(:empty) { color: #c42f55; }
  .btn.daily .d3 { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: calc(var(--u) * 11); letter-spacing: 0; color: #1f5c43; display: flex; gap: calc(var(--u) * 8); }
  .btn.daily .d3:empty, .btn.daily .d3:has(span:empty + span:empty) { display: none; }
  .startsel { margin: calc(var(--u) * -4) 0 0; display: flex; align-items: center; gap: calc(var(--u) * 5); font-weight: 900; font-size: calc(var(--u) * 11.5); color: #ffe6c2;
    background: rgba(43,20,66,.6); border-radius: calc(var(--u) * 16); padding: calc(var(--u) * 3) calc(var(--u) * 5) calc(var(--u) * 3) calc(var(--u) * 12); }
  .startsel button { font-family: 'Bangers', sans-serif; font-size: calc(var(--u) * 15); letter-spacing: calc(var(--u) * .5); min-width: calc(var(--u) * 34); height: calc(var(--u) * 30); border-radius: calc(var(--u) * 12);
    border: calc(var(--u) * 2) solid rgba(255,230,194,.5); background: transparent; color: #ffe6c2; cursor: pointer; touch-action: manipulation; padding: 0 calc(var(--u) * 6); }
  .startsel button.on { background: linear-gradient(180deg, #fff0a8, #ffb347); color: #3a1c04; border-color: #2b1442; }
  .pill { background: rgba(28,12,50,.55); border-radius: calc(var(--u) * 14); padding: calc(var(--u) * 6) calc(var(--u) * 14); }
  #stage.short #title { padding-top: calc(var(--u) * 34 + var(--inset-top, 0px)); }
  #stage.short .logo .l1 { font-size: calc(var(--u) * 78); }
  #stage.short .logo .l2 { font-size: calc(var(--u) * 66); }
  #stage.short #hintrow { margin-top: calc(var(--u) * 12); }
  .chip { margin-left: calc(var(--u) * 12); font-family: 'Nunito', sans-serif; font-weight: 900; font-size: calc(var(--u) * 12); color: #ffe6c2; background: rgba(43,20,66,.6); border: calc(var(--u) * 2) solid rgba(255,230,194,.6);
    border-radius: calc(var(--u) * 14); padding: calc(var(--u) * 4) calc(var(--u) * 10); vertical-align: middle; cursor: pointer; touch-action: manipulation; }
  .chip b { font-family: 'Bangers', sans-serif; font-weight: 400; font-size: 1.3em; color: var(--sun2); margin-left: calc(var(--u) * 3); letter-spacing: calc(var(--u) * 1); }
  .chip:active { transform: scale(.95); }
  #patches { justify-content: center; justify-content: safe center; }
  #patchGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 8) calc(var(--u) * 6); width: 100%; max-width: calc(var(--u) * 330); }
  .patch { display: flex; flex-direction: column; align-items: center; text-align: center; opacity: .55; }
  .patch.got { opacity: 1; }
  .pbadge { width: calc(var(--u) * 46); height: calc(var(--u) * 46); border-radius: 50%; display: grid; place-items: center; background: #4a3166; border: calc(var(--u) * 3) solid #2b1442;
    box-shadow: inset 0 0 0 calc(var(--u) * 3) #4a3166, inset 0 0 0 calc(var(--u) * 4.5) rgba(255,230,194,.35); }
  .pbadge svg { width: 58%; height: 58%; fill: #6b5288; stroke: #6b5288; }
  .patch.got .pbadge svg { fill: #2b1442; stroke: #2b1442; }
  #btnBalloon { position: absolute; left: calc(var(--u) * 6); bottom: calc(var(--u) * 26 + var(--inset-bot, 0px)); width: calc(var(--u) * 58); height: calc(var(--u) * 58); border-radius: 50%; z-index: 4;
    border: calc(var(--u) * 3) solid #2b1442; padding: 0; pointer-events: none !important; touch-action: none; display: grid; place-items: center; opacity: .92;
    background: linear-gradient(0deg, #5cc2ff 0%, #5cc2ff var(--fill, 0%), #3a2356 var(--fill, 0%)); box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(15,3,30,.5); }
  #btnBalloon svg { width: 56%; height: 56%; fill: rgba(255,244,214,.55); }
  #btnBalloon span { display: none; }
  #btnBalloon.ready { opacity: 1; background: radial-gradient(circle at 40% 35%, #e6f8ff, #5cc2ff 55%, #1f78c8); animation: bready .7s ease-in-out infinite; cursor: pointer; }
  #btnBalloon.ready svg { fill: #fff; stroke: #2b1442; stroke-width: 1.2; width: 50%; height: 50%; margin-top: calc(var(--u) * -6); }
  #btnBalloon.ready span { display: block; position: absolute; bottom: calc(var(--u) * 4); font-family: 'Bangers', sans-serif; font-size: calc(var(--u) * 13); color: #fff; -webkit-text-stroke: calc(var(--u) * 1) #2b1442; paint-order: stroke fill; letter-spacing: calc(var(--u) * 1); }
  @keyframes bready { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  .medal { display: inline-block; font-family: 'Bangers', sans-serif; font-weight: 400; padding: 0 calc(var(--u) * 8); border-radius: calc(var(--u) * 10); border: calc(var(--u) * 2) solid #2b1442; letter-spacing: calc(var(--u) * 1); }
  .medal.mGold { background: linear-gradient(180deg, #fff0a8, #f5b82e); color: #5a3a00; }
  .medal.mSilver { background: linear-gradient(180deg, #ffffff, #c9cfe0); color: #3a3a55; }
  .medal.mBronze { background: linear-gradient(180deg, #ffd2a8, #d9874a); color: #4a2408; }
  .patch.got .pbadge { background: radial-gradient(circle at 35% 30%, #fff0a8, #ffb347 60%, #e0577a); box-shadow: inset 0 0 0 calc(var(--u) * 3) transparent, inset 0 0 0 calc(var(--u) * 4.5) rgba(255,255,255,.8), 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(15,3,30,.5); }
  .patch.got .pbadge span { color: #fff; -webkit-text-stroke: calc(var(--u) * 1.5) #2b1442; paint-order: stroke fill; font-size: calc(var(--u) * 24); }
  .pname { font-family: 'Bangers', sans-serif; font-size: calc(var(--u) * 15); letter-spacing: calc(var(--u) * .5); color: #fff4d6; margin-top: calc(var(--u) * 3); }
  .pdesc { font-weight: 800; font-size: calc(var(--u) * 10); color: #e7cfe0; line-height: 1.2; }
  #over { justify-content: center; justify-content: safe center; }
  .goal b { color: #c42f55; }
  /* small stage (landscape / tiny screens): keep tap targets at least ~34 px */
  .chip { min-height: 32px; }
  .startsel button { min-height: 32px; min-width: 34px; }
  .btn.alt { min-height: 40px; }
  #over .stat { opacity: 0; animation: statin .32s ease-out forwards; }
  #over .stat:nth-of-type(1) { animation-delay: .15s; } #over .stat:nth-of-type(2) { animation-delay: .3s; } #over .stat:nth-of-type(3) { animation-delay: .45s; }
  #over .stat:nth-of-type(4) { animation-delay: .6s; } #over .stat:nth-of-type(5) { animation-delay: .75s; } #over .stat:nth-of-type(6) { animation-delay: .9s; }
  #over .goal { opacity: 0; animation: statin .4s ease-out 1.1s forwards; }
  @keyframes statin { from { opacity: 0; transform: translateX(calc(var(--u) * -14)); } to { opacity: 1; transform: none; } }
  noscript { position: absolute; top: 40%; width: 100%; text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <button id="btnBalloon" aria-label="Water balloon" style="display:none"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="10" rx="7" ry="8"/><path d="M12 18l-2 3h4z"/><circle cx="9.5" cy="7.5" r="1.8" fill="#e6f8ff"/></svg><span>TAP!</span></button>
  <div id="hudbtns">
    <button class="round" id="btnSound" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" stroke="none"/><path id="sndWaves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="round" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" stroke="none"/></svg></button>
  </div>

  <section id="title" class="screen">
    <div class="logo disp"><span class="l1">SEAGULL</span><span class="l2">SIEGE</span></div>
    <div class="tag">A SWOOPING FORMATION SHOOTER · LAKESIDE PICNIC</div>
    <div class="stack">
      <button class="btn big" id="btnPlay">PLAY</button>
      <div class="startsel" id="btnStart" style="display:none"></div>
      <button class="btn daily" id="btnDaily"><span class="d1">DAILY PICNIC</span><span class="d2"><span id="dailyMod">Breezy Day</span></span><span class="d3"><span id="dailyBest"></span><span id="dailyStreak"></span></span></button>
      <div class="sndrow" style="margin-top:0">
        <button class="btn alt" id="tMusic">♪ MUSIC ON</button>
        <button class="btn alt" id="tSfx">SFX ON</button>
      </div>
    </div>
    <div id="hintrow" class="pill">Drag to slide · it fires while you touch<br>Guard the <b>fries</b> — the boss gull wants them!</div>
    <div class="best">BEST <b id="titleBest">0</b><button class="chip" id="btnPatches">PATCHES <b id="patchCount">0/12</b></button></div>
  </section>

  <section id="patches" class="screen shade">
    <h2 class="disp gold">PICNIC PATCHES</h2>
    <p class="sub" id="patchSub"></p>
    <div id="patchGrid"></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="patchClose">BACK</button></div>
  </section>

  <section id="pause" class="screen shade">
    <h2 class="disp">PAUSED</h2>
    <p class="sub" id="pauseSub"></p>
    <div class="stack">
      <button class="btn big" id="pResume" style="animation:none">RESUME</button>
      <div class="row" style="margin-top:0">
        <button class="btn alt" id="pRestart">RESTART</button>
        <button class="btn alt" id="pTitle">MENU</button>
      </div>
      <div class="sndrow" style="margin-top:4px">
        <button class="btn alt" id="pMusic">♪ MUSIC ON</button>
        <button class="btn alt" id="pSfx">SFX ON</button>
      </div>
    </div>
  </section>

  <section id="over" class="screen shade">
    <h2 class="disp gold">FRIES GONE!</h2>
    <div id="newBest" class="badge" style="display:none">NEW BEST!</div>
    <p class="sub" id="overSub"></p>
    <div class="stat">SCORE<b id="ovScore">0</b></div>
    <div class="stat"><span id="ovBestLbl">BEST</span><b id="ovBest">0</b></div>
    <div class="stat">STAGE REACHED<b id="ovStage">1</b></div>
    <div class="stat">ACCURACY<b id="ovAcc">0%</b></div>
    <div class="stat">GULLS SHOOED<b id="ovShooed">0</b></div>
    <div class="stat">BEST COMBO<b id="ovCombo">x1</b></div>
    <div class="goal" id="ovGoal"></div>
    <div class="row" style="margin-top:14px"><button class="btn big" id="ovRetry">TRY AGAIN</button></div>
    <div class="row" style="margin-top:12px"><button class="btn alt" id="ovTitle">MENU</button></div>
  </section>
</div>
<noscript>This game needs JavaScript.</noscript>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
